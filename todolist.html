<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todolist">
        <h1>Task Tracker kuliah Arul</h1>

        <section class="input">
            <input type="text" id="taskInput" placeholder="Judul kegiatan">
            <select name="mata kuliah" id="courseInput">
                <option value="">pilih mata kuliah</option>
                <option value="kjk">keamanan jaringan komputer</option>
                <option value="pemweb">Pemrograman Web</option>
                <option value="pemmob">Pemrograman mobile</option>
                <option value="jarkom">Komunikasi data dan jaringan komputer</option>
                <option value="kompro">Komunikasi profesional</option>
                <option value="iot">Internet of Things</option>
            </select>
            <input type="date" id="dueDateInput">
            <button id="addButton">create</button>
        </section>

        <section class="list">
            <button class="filter" id="all" value="all">all</button>
            <button class="filter" id="done" value="done">done</button>
            <button class="filter" id="active" value="active">active</button>

            <ul id="task"></ul>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
